name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC token for aws-actions/configure-aws-credentials
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  # PRs and main: typecheck + render. verify.ts fails the job if any
  # {{placeholder}} got escaped or mangled in the rendered HTML.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails the build on a known-vulnerable dependency.
      #
      # --omit=dev here, unlike the other two repos, because the only dev
      # dependency with advisories is @react-email/preview-server, which bundles
      # an old Next.js and is used solely by `npm run dev`. Nothing in `build` or
      # `sync` touches it (those run @react-email/render + the AWS SDK, both
      # production deps), so it never executes in CI or reaches SES. There is no
      # fixed release to move to — npm's suggested "fix" is a downgrade. Dependabot
      # still opens PRs for it; this gate just does not block the deploy on it.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  sync-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npm run sync:dev

  # Prod sync is gated by the "production" GitHub environment — configure a
  # required reviewer on it (Settings → Environments → production) so this
  # job waits for manual approval after dev succeeds.
  sync-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: sync-dev
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npm run sync:prod
